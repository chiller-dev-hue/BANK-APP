<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Reen Bank</title>
    <link rel="stylesheet" href="../output.css">
</head>

<body class="min-h-screen bg-mint text-dark">

         <!-- LOGIN PAGE -->
    <main class="min-h-screen">
        <div class="mx-auto flex min-h-screen max-w-7xl flex-col lg:flex-row">

                 <!-- LEFT SIDE -->
            <section class="flex w-full flex-col justify-between px-6 py-8 sm:px-10 lg:w-1/2 lg:px-12 lg:py-10">

                <!-- Logo -->
                <div>
                    <a href="./index.html" class="inline-flex items-center">
                        <img src="../assets/images/Logo.png" alt="Reen Bank logo" class="h-12 w-auto">
                    </a>
                </div>

                <!-- Main Content -->
                <div class="my-12 max-w-2xl lg:my-0">
                    <p class="mb-3 text-lg font-semibold text-primary">
                        Reen Bank
                    </p>
                    <h1 class="text-4xl font-bold leading-tight sm:text-5xl lg:text-6xl">
                        Experience
                        <br>
                        hassle-free banking
                    </h1>
                    <p class="mt-6 max-w-xl text-base leading-7 text-dark/70 sm:text-lg">
                        Experience simple, secure, and stress-free banking.
                        Say goodbye to long queues and complex procedures
                        and hello to hassle-free banking with Reen Bank.
                    </p>
                </div>

                <!-- Social Icons -->
                <div class="flex items-center gap-4">
                    <a href="#" aria-label="Facebook">
                        <img src="../assets/images/icons8-facebook-48.png" alt="" class="h-9 w-9">
                    </a>
                    <a href="#" aria-label="Instagram">
                        <img src="../assets/images/icons8-instagram-logo-48.png" alt="" class="h-9 w-9">
                    </a>
                    <a href="#" aria-label="Twitter">
                        <img src="../assets/images/icons8-twitter-bird-48.png" alt="" class="h-9 w-9">
                    </a>
                </div>
            </section>

                 <!-- RIGHT SIDE -->
            <section class="flex w-full items-center justify-center px-5 py-10 sm:px-8 lg:w-1/2 lg:px-10">
                <div class="w-full max-w-2xl rounded-[2rem] bg-white p-7 shadow-sm sm:p-10 lg:p-12">

                    <!-- Heading -->
                    <h2 class="text-3xl font-semibold text-primary sm:text-4xl">
                        Login
                    </h2>

                    <!-- Login Form -->
                    <form id="login-form" class="mt-10 space-y-5">

                             <!-- EMAIL -->
                        <div>
                            <label for="login-email" class="mb-2 block text-sm font-semibold">
                                Email
                            </label>
                            <div class="relative">
                                <input
                                    id="login-email"
                                    name="email"
                                    type="email"
                                    placeholder="Enter your Email"
                                    autocomplete="email"
                                    required
                                    class="h-14 w-full rounded-xl border border-dark/30 bg-white px-5 pr-14 text-sm outline-none transition focus:border-primary focus:ring-1 focus:ring-primary">
                                <img src="../assets/icons/mail.svg" alt="" class="pointer-events-none absolute right-5 top-1/2 h-5 w-5 -translate-y-1/2 opacity-50">
                            </div>
                        </div>

                             <!-- PASSWORD -->
                        <div>
                            <div class="mb-2 flex items-center justify-between">
                                <label for="login-password" class="block text-sm font-semibold">
                                    Password
                                </label>
                                <a href="#" id="forgot-password" class="text-sm font-semibold text-primary transition hover:opacity-80">
                                    Forgot Password?
                                </a>
                            </div>

                            <div class="relative">
                                <input
                                    id="login-password"
                                    name="password"
                                    type="password"
                                    placeholder="Enter your Password"
                                    autocomplete="current-password"
                                    required
                                    class="h-14 w-full rounded-xl border border-dark/30 bg-white px-5 pr-14 text-sm outline-none transition focus:border-primary focus:ring-1 focus:ring-primary">

                                <!-- Password Visibility -->
                                <button
                                    type="button"
                                    id="toggle-login-password"
                                    aria-label="Show password"
                                    class="absolute right-4 top-1/2 flex h-8 w-8 -translate-y-1/2 items-center justify-center">
                                    <img id="login-password-icon" src="../assets/icons/eye-closed.svg" alt="" class="h-5 w-5 opacity-50">
                                </button>
                            </div>
                        </div>

                             <!-- REMEMBER ME -->
                        <div class="flex items-center gap-3 pt-1">
                            <input
                                id="remember-me"
                                name="remember"
                                type="checkbox"
                                class="h-5 w-5 accent-primary">
                            <label for="remember-me" class="text-sm text-dark/60">
                                Remember me
                            </label>
                        </div>

                        <!-- Login Error Message -->
                        <p id="login-message" class="hidden text-sm"></p>

                             <!-- LOGIN BUTTON -->
                        <button
                            type="submit"
                            class="mt-3 flex h-14 w-full items-center justify-center rounded-xl bg-primary text-base font-semibold text-white transition hover:opacity-90">
                            Login
                        </button>

                             <!-- REGISTER LINK -->
                        <p class="pt-1 text-sm text-dark/40">
                            Don't have an Account?
                            <a href="./register.html" class="ml-1 font-semibold text-primary">
                                Create Account
                            </a>
                        </p>
                    </form>
                </div>
            </section>
        </div>
    </main>

    <!-- JavaScript -->
    <script src="../js/auth.js"></script>

</body>
</html>
