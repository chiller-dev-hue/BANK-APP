<!DOCTYPE html>
<!--
  =========================================================
  REGISTER PAGE — Reen Bank
  Script: ../js/auth.js

  PAGE MAP
  1. Left side: logo, headline, social icons
  2. Right side: registration form (name, email, password, terms)
  3. Scripts
  =========================================================
-->
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | Reen Bank</title>
    <link rel="stylesheet" href="../output.css">
    <!-- Favicon -->
    <link rel="icon" type="image/png" href="../assets/favicon/logo.png">
    <link rel="apple-touch-icon" href="../assets/favicon/logo.png">
  </head>

  <body class="min-h-screen bg-mint text-dark">

    <!-- Register Page -->
    <main class="min-h-screen">
      <div class="mx-auto flex min-h-screen max-w-7xl flex-col lg:flex-row">

        <!-- LEFT SIDE -->
        <section class="flex w-full flex-col justify-between px-6 py-8 sm:px-10 lg:w-1/2 lg:px-12 lg:py-10">

          <!-- Logo -->
          <div>
            <a href="./index.html" aria-label="Go to Reen Bank landing page" class="inline-flex items-center gap-3">
              <img src="../assets/images/logo.png" alt="Reen Bank logo" class="h-12 w-auto">
              <!-- <span class="text-2xl font-semibold">
                        Reen Bank
                        </span> -->
            </a>
          </div>

          <!-- Main Content -->
          <div class="my-12 max-w-2xl lg:my-0">
            <p class="mb-3 text-lg font-semibold text-primary">
              Reen Bank
            </p>
            <h1 class="text-4xl font-bold leading-tight sm:text-5xl lg:text-6xl">
              Experience
              <br>
              hassle-free banking
            </h1>
            <p class="mt-6 max-w-xl text-base leading-7 text-dark/70 sm:text-lg">
              Experience simple, secure, and stress-free banking.
              Say goodbye to long queues and complex procedures
              and hello to hassle-free banking with Reen Bank.
            </p>
          </div>

          <!-- Social Icons -->
          <div class="flex items-center gap-4">
            <a href="#" aria-label="Facebook">
              <img src="../assets/images/icons8-facebook-48.png" alt="" class="h-9 w-9">
            </a>
            <a href="#" aria-label="Instagram">
              <img src="../assets/images/icons8-instagram-logo-48.png" alt="" class="h-9 w-9">
            </a>
            <a href="#" aria-label="Twitter">
              <img src="../assets/images/icons8-twitter-bird-48.png" alt="" class="h-9 w-9">
            </a>
          </div>
        </section>

        <!-- RIGHT SIDE -->
        <section class="flex w-full items-center justify-center px-5 py-10 sm:px-8 lg:w-1/2 lg:px-10">
          <div class="w-full max-w-2xl rounded-[2rem] bg-white p-7 shadow-sm sm:p-10 lg:p-12">

            <!-- Heading -->
            <h2 class="text-3xl font-semibold text-primary sm:text-4xl">
              Register
            </h2>

            <!-- Registration Form -->
            <form id="register-form" class="mt-10 space-y-5">

              <!-- Name -->
              <div>
                <label for="name" class="mb-2 block text-sm font-semibold">
                  Name
                </label>
                <div class="relative">
                  <input id="name"
                    name="name"
                    type="text"
                    placeholder="Enter name here"
                    autocomplete="name"
                    required
                    class="h-14 w-full rounded-xl border border-dark/30 bg-white px-5 pr-14 text-sm outline-none transition focus:border-primary focus:ring-1 focus:ring-primary">
                  <img src="../assets/icons/user.svg" alt="" class="pointer-events-none absolute right-5 top-1/2 h-5 w-5 -translate-y-1/2 opacity-50">
                </div>
              </div>

              <!-- Email -->
              <div>

                <label for="email" class="mb-2 block text-sm font-semibold">
                  Email
                </label>
                <div class="relative">
                  <input id="email"
                    name="email"
                    type="email"
                    placeholder="Enter your Email"
                    autocomplete="email"
                    required
                    class="h-14 w-full rounded-xl border border-dark/30 bg-white px-5 pr-14 text-sm outline-none transition focus:border-primary focus:ring-1 focus:ring-primary">
                  <img src="../assets/icons/mail.svg" alt="" class="pointer-events-none absolute right-5 top-1/2 h-5 w-5 -translate-y-1/2 opacity-50">
                </div>
              </div>

              <!-- Password -->
              <div>
                <label for="password" class="mb-2 block text-sm font-semibold">
                  Password
                </label>
                <div id="register-password-wrapper" class="relative">
                  <input id="password"
                    name="password"
                    type="password"
                    placeholder="Enter your Password"
                    autocomplete="new-password"
                    required
                    class="h-14 w-full rounded-xl border border-dark/30 bg-white px-5 pr-24 text-sm outline-none transition focus:border-primary focus:ring-1 focus:ring-primary">

                  <!-- Right-side password icons -->
                  <div class="absolute right-4 top-1/2 flex -translate-y-1/2 items-center gap-3">
                    <!-- Password Toggle Eye icon -->
                    <button
                      id="toggle-register-password"
                      type="button"
                      aria-label="show-password"
                      class="hidden items-center justify-center">
                      <img id="register-password-icon" src="../assets/icons/eye-closed.svg" alt="Show Password" class="h-5 w-5 opacity-50">
                    </button>

                    <!-- Keyhole icon -->
                    <img src="../assets/icons/lock-keyhole.svg" alt="" class="h-5 w-5 opacity-50">
                  </div>

                </div>


                <!-- Register Validation Message -->
                <p id="register-message" class="hidden mt-2 text-sm text-red-500"></p>
              </div>

              <!-- Terms -->
              <div class="flex items-start gap-3 pt-1">
                <input id="terms"
                  name="terms"
                  type="checkbox"
                  required
                  class="mt-1 h-5 w-5 accent-primary">
                <label for="terms" class="text-sm leading-6 text-dark/50">
                  I agree to all the
                  <a href="#" class="font-semibold text-primary">
                    Terms
                  </a>
                  <a href="#" class="font-semibold text-primary">
                    Privacy Policy
                  </a>
                  and
                  <a href="#" class="font-semibold text-primary">
                    Fees.
                  </a>
                </label>
              </div>

              <!-- Register Button -->
              <button type="submit" class="mt-3 flex h-14 w-full items-center justify-center rounded-xl bg-primary text-base font-semibold text-white transition hover:opacity-90">
                Register
              </button>

              <!-- Login Link -->
              <p class="pt-1 text-sm text-dark/40">
                Already have an Account?
                <a href="./login.html" class="ml-1 font-semibold text-primary">
                  Log in.
                </a>
              </p>
            </form>
          </div>
        </section>
      </div>
    </main>

    <!-- JavaScript -->
    <script src="../js/auth.js"></script>

  </body>
</html>
