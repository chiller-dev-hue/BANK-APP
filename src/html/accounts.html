<!DOCTYPE html>
<!--
  =========================================================
  ACCOUNTS PAGE — Reen Bank
  Script: ../js/bank.js

  PAGE MAP
  1. Sidebar navigation + mobile overlay
  2. Header (title, identity, search, notifications, avatar)
  3. Account cards + selected-account transactions
  4. Scripts
  =========================================================
-->
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Accounts | Reen Bank</title>

  <link rel="stylesheet" href="../output.css">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  >
  <!-- Favicon -->
  <link rel="icon" type="image/png" href="../assets/favicon/logo.png">
  <link rel="apple-touch-icon" href="../assets/favicon/logo.png">
</head>


<body class="h-screen overflow-hidden bg-[#f2fbf8] font-poppins text-[#242424]">

  <!-- Background -->
  <div
    class="pointer-events-none fixed inset-0 -z-10 bg-[#f2fbf8]"
    aria-hidden="true"
  ></div>


  <!-- =========================================================
       PAGE WRAPPER
       ========================================================= -->
  <div class="flex h-screen min-h-0 overflow-hidden">


    <!-- =======================================================
         SIDEBAR
         ======================================================= -->
    <aside
      id="dashboard-sidebar"
      class="fixed inset-y-0 left-0 z-50 flex w-[270px] -translate-x-full flex-col overflow-hidden bg-[#f2fbf8] px-8 py-8 transition-transform duration-300 lg:translate-x-0"
    >

      <!-- Logo -->
      <div class="flex items-center">
        <img
          src="../assets/images/logo.png"
          alt="Reen Bank"
          class="h-11 w-auto"
        >
      </div>


      <!-- Navigation -->
      <nav
        class="mt-24"
        aria-label="Primary navigation"
      >

        <ul class="space-y-7">

          <!-- Overview -->
          <li>
            <a
              href="./dashboard.html"
              class="flex items-center gap-7 text-[15px] font-normal text-[#555555] transition hover:text-primary"
            >
              <span class="flex h-7 w-7 shrink-0 items-center justify-center">
                <img
                  src="../assets/icons/house.svg"
                  alt=""
                  class="h-6 w-6"
                >
              </span>

              <span>Overview</span>
            </a>
          </li>


          <!-- Accounts -->
          <li>
            <a
              href="./accounts.html"
              aria-current="page"
              class="flex items-center gap-7 text-[15px] font-normal text-primary"
            >
              <span class="flex h-7 w-7 shrink-0 items-center justify-center">
                <img
                  src="../assets/icons/credit-card.svg"
                  alt=""
                  class="h-6 w-6"
                >
              </span>

              <span>Accounts</span>
            </a>
          </li>


          <!-- Transactions -->
          <li>
            <a
              href="./transaction.html"
              class="flex items-center gap-7 text-[15px] font-normal text-[#555555] transition hover:text-primary"
            >
              <span class="flex h-7 w-7 shrink-0 items-center justify-center">
                <img
                  src="../assets/icons/arrow-left-right.svg"
                  alt=""
                  class="h-6 w-6"
                >
              </span>

              <span>Transactions</span>
            </a>
          </li>


          <!-- Profile -->
          <li>
            <a
              href="./profile.html"
              class="flex items-center gap-7 text-[15px] font-normal text-[#555555] transition hover:text-primary"
            >
              <span class="flex h-7 w-7 shrink-0 items-center justify-center">
                <img
                  src="../assets/icons/user.svg"
                  alt=""
                  class="h-6 w-6"
                >
              </span>

              <span>Profile</span>
            </a>
          </li>

        </ul>

      </nav>


      <!-- Logout -->
      <div class="mt-auto">

        <button
          id="logout-button"
          type="button"
          class="flex items-center gap-7 text-[15px] font-normal text-[#555555] transition hover:text-red-500"
        >
          <span class="flex h-7 w-7 shrink-0 items-center justify-center">
            <img
              src="../assets/icons/log-out.svg"
              alt=""
              class="h-6 w-6"
            >
          </span>

          <span>Logout</span>
        </button>

      </div>

    </aside>


    <!-- Mobile Sidebar Overlay -->
    <div
      id="dashboard-overlay"
      class="fixed inset-0 z-40 hidden bg-black/30 lg:hidden"
    ></div>


    <!-- =========================================================
         MAIN CONTENT
         ========================================================= -->
    <main
      class="min-w-0 min-h-0 flex-1 overflow-hidden px-4 sm:px-6 lg:ml-[260px] lg:px-8 xl:px-10"
    >

      <div class="flex h-full min-h-0 flex-col overflow-hidden">


        <!-- =====================================================
             TOP NAVBAR
             ===================================================== -->
        <header class="shrink-0 pt-5 sm:pt-6 lg:pt-7">

          <div
            class="grid min-w-0 min-h-[44px] items-center gap-5 max-lg:grid-cols-[auto_minmax(0,1fr)_auto_auto_auto] max-sm:gap-x-1.5 sm:max-lg:gap-x-4 lg:grid-cols-[minmax(0,1fr)_auto] lg:gap-10"
          >

            <!-- LEFT: PAGE TITLE -->
            <div class="flex min-w-0 items-center gap-3 max-lg:contents">

              <!-- Mobile Menu -->
              <button
                id="dashboard-menu-button"
                type="button"
                aria-label="Open navigation menu"
                aria-expanded="false"
                aria-controls="dashboard-sidebar"
                class="flex h-10 w-10 shrink-0 items-center justify-center rounded-lg border border-black/10 bg-white lg:hidden"
              >
                <img
                  src="../assets/icons/menu.svg"
                  alt=""
                  class="h-4 w-4"
                >
              </button>


              <!-- Page Title -->
              <h1
                class="m-0 shrink-0 text-[28px] font-semibold leading-none tracking-tight max-lg:order-last max-lg:col-span-5 max-lg:font-bold max-lg:text-[#111] max-sm:text-[24px] sm:max-lg:!text-[30px] sm:text-[32px]"
              >
                Accounts
              </h1>

            </div>


            <!-- RIGHT SIDE -->
            <div
              class="flex min-w-0 items-center justify-end gap-6 max-lg:contents lg:gap-8"
            >

              <!-- Desktop Account Identity -->
              <div
                class="hidden w-fit items-center justify-center max-lg:flex lg:flex"
              >

                <div class="w-fit text-right max-lg:text-left">

                  <p
                    id="dashboard-user-name"
                    class="whitespace-nowrap text-base max-sm:text-xs font-medium leading-tight text-primary"
                  >
                    Maureen Oguche
                  </p>

                  <h2
                    id="dashboard-account-number"
                    class="mt-0.5 whitespace-nowrap text-3xl max-sm:text-lg font-bold leading-none tracking-tight"
                  >
                    1234567890
                </h2>

                </div>

              </div>


              <!-- Mobile Account Information -->
              <span
                id="dashboard-user-name-mobile"
                class="hidden"
              >
                Maureen Oguche
              </span>

              <span
                id="dashboard-account-number-mobile"
                class="hidden"
              >
                1234567890
              </span>


              <!-- SEARCH -->
              <div
                class="hidden min-w-0 items-center gap-2 max-md:flex max-sm:gap-1.5 md:flex"
              >

                <img
                  src="../assets/icons/search.svg"
                  alt="Search"
                  class="h-4 w-4 shrink-0"
                >

                <input
                  id="accounts-transaction-search"
                  type="search"
                  placeholder="Search"
                  aria-label="Search"
                  class="w-20 max-sm:w-12 bg-transparent text-xs outline-none placeholder:text-[#777] sm:w-24"
                >

              </div>


              <!-- Mobile Search -->
              <button
                type="button"
                aria-label="Search"
                class="flex h-8 w-8 items-center justify-center max-md:hidden md:hidden"
              >
                <img
                  src="../assets/icons/search.svg"
                  alt=""
                  class="h-4 w-4"
                >
              </button>


              <!-- NOTIFICATIONS -->
              <div class="relative">

                <button
                  id="dashboard-notification-button"
                  type="button"
                  aria-label="Notifications"
                  aria-expanded="false"
                  class="relative flex h-8 w-8 shrink-0 items-center justify-center"
                >

                  <img
                    src="../assets/icons/bell.svg"
                    alt=""
                    class="h-5 w-5 opacity-70"
                  >

                  <span
                    id="dashboard-notification-dot"
                    class="absolute right-1 top-1 hidden h-2 w-2 rounded-full bg-danger"
                  ></span>

                </button>


                <!-- Notification Panel -->
                <div
                  id="dashboard-notification-panel"
                  class="absolute right-0 top-10 z-[90] hidden w-[300px] max-w-[calc(100vw-32px)] overflow-hidden rounded-xl border border-[#e4e4e4] bg-[#f4f4f4] p-2.5 shadow-xl"
                >

                  <div
                    class="flex items-center gap-3"
                  >

                    <h3 class="text-sm font-semibold text-[#111]">
                      Notifications
                    </h3>

                    <button
                      id="dashboard-clear-notifications"
                      type="button"
                      class="text-xs font-semibold text-primary hover:underline"
                    >
                      Clear
                    </button>

                  </div>

                  <div
                    id="dashboard-notification-list"
                    class="mt-3 space-y-2"
                  ></div>

                </div>

              </div>


              <!-- PROFILE -->
              <a
                id="dashboard-profile-link"
                href="./profile.html"
                aria-label="Open profile"
                class="relative inline-flex h-10 w-10 max-sm:h-9 max-sm:w-9 shrink-0 items-center justify-center overflow-hidden rounded-full border border-[rgba(69,32,128,0.08)] bg-[#e2cfff] text-sm font-bold leading-none text-[#452080] no-underline"
              >

                <span
                  id="dashboard-profile-initials"
                  aria-hidden="true"
                  class="absolute inset-0 flex h-full w-full items-center justify-center overflow-hidden rounded-full bg-[#e2cfff] bg-cover bg-center bg-no-repeat"
                >
                  MO
                </span>

              </a>

            </div>

          </div>

        </header>


        <!-- ===================================================
             ACCOUNTS + TRANSACTIONS CONTENT
             =================================================== -->
        <section
          class="flex min-h-0 flex-1 flex-col overflow-hidden pt-4 sm:pt-5 lg:pt-3"
        >


          <!-- =================================================
               ACCOUNT CARDS
               ================================================= -->
          <div
            id="accounts-container"
            class="accounts-no-scrollbar flex min-w-0 shrink-0 gap-4 overflow-x-auto overflow-y-hidden pb-1 max-lg:mt-3 max-lg:[&>*]:!h-[146px] max-lg:[&_[data-account-card]>div:first-child]:contents max-lg:[&_[data-account-balance]]:mt-0 [scrollbar-width:none] [&::-webkit-scrollbar]:hidden"
          >

            <!-- MAIN ACCOUNT -->
            <article
              data-account-card
              data-account-key="main"
              class="flex reen-account-card-138 lg:!h-[144px] lg:[&>div:first-child]:flex lg:[&>div:first-child]:flex-1 lg:[&>div:first-child]:flex-col lg:[&_[data-account-balance]]:!my-auto w-[220px] min-w-[220px] shrink-0 cursor-pointer flex-col justify-between rounded-xl border-l-[6px] border-transparent bg-[#D4F3E7] p-4 transition-[border-color,box-shadow] duration-150"
            >

              <div class="min-w-0">

                <div class="flex items-center gap-3">

                  <p
                    class="min-w-0 truncate text-sm font-semibold text-[#452080]"
                  >
                    Main Account
                  </p>

                  <button
                    type="button"
                    data-toggle-account-balance
                    class="flex h-5 w-5 shrink-0 items-center justify-center"
                    aria-label="Toggle Main Account balance"
                  >
                    <img src="../assets/icons/eye.svg" alt="" class="h-4 w-4 opacity-70">
                  </button>

                </div>

                <h2
                  data-account-balance="main"
                  class="mt-4 w-full truncate text-left text-lg font-bold leading-none text-[#111]"
                >
                  ₦ 0.00
                </h2>

              </div>

              <div class="flex gap-2 lg:translate-y-1.5">

                <button
                  type="button"
                  data-account-action="fund"
                  data-account="main"
                  class="min-w-0 flex-1 rounded-md bg-primary px-2 py-1.5 text-[11px] font-semibold text-white"
                >
                  Fund
                </button>

                <button
                  type="button"
                  data-account-action="withdraw"
                  data-account="main"
                  class="min-w-0 flex-1 rounded-md bg-[#D0D0D0] px-2 py-1.5 text-[11px] font-semibold text-[#333]"
                >
                  Withdraw
                </button>

              </div>

            </article>


            <!-- =================================================
     SCHOOL SAVINGS
     ================================================= -->
<article
  data-account-card
  data-account-key="school"
  class="flex reen-account-card-138 lg:!h-[144px] lg:[&>div:first-child]:flex lg:[&>div:first-child]:flex-1 lg:[&>div:first-child]:flex-col lg:[&_[data-account-balance]]:!my-auto w-[220px] min-w-[220px] shrink-0 cursor-pointer flex-col justify-between rounded-xl border-l-[6px] border-transparent bg-[#D4F3E7] p-4 transition-[border-color,box-shadow] duration-150"
>

  <div class="min-w-0">

    <!-- Account name + eye -->
    <div class="flex items-center gap-3">

      <p
        class="min-w-0 truncate text-sm font-semibold text-[#452080]"
      >
        School Savings
      </p>

      <button
        type="button"
        data-toggle-account-balance
        class="flex h-5 w-5 shrink-0 items-center justify-center"
        aria-label="Toggle School Savings balance"
      >
        <img src="../assets/icons/eye.svg" alt="" class="h-4 w-4 opacity-70">
      </button>

    </div>

    <!-- Balance: left aligned and slightly lower -->
    <h2
      data-account-balance="school"
      class="mt-4 w-full truncate text-left text-lg font-bold leading-none text-[#111]"
    >
      ₦ 0.00
    </h2>

  </div>

  <!-- Same button layout as Main Account -->
  <div class="flex gap-2 lg:translate-y-1.5">

    <button
      type="button"
      data-account-action="fund"
      data-account="school"
      class="min-w-0 flex-1 rounded-md bg-primary px-2 py-1.5 text-[11px] font-semibold text-white"
    >
      Fund
    </button>

    <button
      type="button"
      data-account-action="withdraw"
      data-account="school"
      class="min-w-0 flex-1 rounded-md bg-[#D0D0D0] px-2 py-1.5 text-[11px] font-semibold text-[#333]"
    >
      Withdraw
    </button>

  </div>

</article>

            <!-- HOLIDAY PLAN -->
            <article
              data-account-card
              data-account-key="holiday"
              class="flex reen-account-card-138 lg:!h-[144px] lg:[&>div:first-child]:flex lg:[&>div:first-child]:flex-1 lg:[&>div:first-child]:flex-col lg:[&_[data-account-balance]]:!my-auto w-[220px] min-w-[220px] shrink-0 cursor-pointer flex-col justify-between rounded-xl border-l-[6px] border-transparent bg-[#D4F3E7] p-4 transition-[border-color,box-shadow] duration-150"
            >

              <div class="min-w-0">

                <div class="flex items-center gap-3">

                  <p
                    class="min-w-0 truncate text-sm font-semibold text-[#452080]"
                  >
                    Holiday Plan
                  </p>

                  <button
                    type="button"
                    data-toggle-account-balance
                    class="flex h-5 w-5 shrink-0 items-center justify-center"
                    aria-label="Toggle Holiday Plan balance"
                  >
                    <img src="../assets/icons/eye.svg" alt="" class="h-4 w-4 opacity-70">
                  </button>

                </div>

                <h2
                  data-account-balance="holiday"
                  class="mt-4 w-full truncate text-left text-lg font-bold leading-none text-[#111]"
                >
                  ₦ 0.00
                </h2>

              </div>

              <div class="flex gap-2 lg:translate-y-1.5">

                <button
                  type="button"
                  data-account-action="fund"
                  data-account="holiday"
                  class="min-w-0 flex-1 rounded-md bg-primary px-2 py-1.5 text-[11px] font-semibold text-white"
                >
                  Fund
                </button>

                <button
                  type="button"
                  data-account-action="withdraw"
                  data-account="holiday"
                  class="min-w-0 flex-1 rounded-md bg-[#D0D0D0] px-2 py-1.5 text-[11px] font-semibold text-[#333]"
                >
                  Withdraw
                </button>

              </div>

            </article>




          <!-- ADD ACCOUNT CARD (always kept last) -->
          <button
            type="button"
            data-add-account-card
            data-add-account-button
            aria-label="Add Account"
            class="flex reen-account-card-138 lg:!h-[144px] w-[220px] min-w-[220px] shrink-0 cursor-pointer flex-col justify-between rounded-xl bg-[#F0F0F0] p-4 text-[#333] transition hover:bg-[#e8e8e8]"
          >
            <div class="flex items-center gap-3">
              <span class="text-2xl font-normal leading-none">+</span>
              <span class="text-sm font-semibold">Add Account</span>
            </div>
            <p class="self-start text-lg font-bold leading-none">₦ 00,000.00</p>
          </button>


          </div>


          <!-- ===================================================
               TRANSACTIONS
               =================================================== -->
          <div
            class="mt-5 flex min-h-0 flex-1 flex-col overflow-hidden pb-4 lg:mt-2 lg:pb-2"
          >

            <!-- Heading -->
            <div
              class="flex shrink-0 items-center justify-between gap-4 pb-0"
            >

              <h2
                class="text-xl font-semibold text-[#111]"
              >
                Transactions
              </h2>

              <a
                href="./transaction.html"
                class="flex shrink-0 items-center gap-2 text-sm font-semibold text-primary"
              >

                <span>
                  View All
                </span>

                <span
                  class="flex h-5 w-5 items-center justify-center"
                  aria-hidden="true"
                >
                  <img
                    src="../assets/icons/arrow-right.svg"
                    alt=""
                    class="h-5 w-5 [filter:brightness(0)_saturate(100%)_invert(60%)_sepia(45%)_saturate(700%)_hue-rotate(105deg)_brightness(90%)_contrast(90%)]"
                  >
                </span>

              </a>

            </div>


            <!-- Transaction list -->
            <div
              class="min-h-0 flex-1 overflow-hidden"
            >

              <div
                id="dashboard-transactions-list"
                data-accounts-transaction-list
                class="accounts-no-scrollbar flex h-full min-h-0 min-w-0 flex-col overflow-hidden pb-2 lg:pb-0 [scrollbar-width:none] [&::-webkit-scrollbar]:hidden [&>*]:min-h-[34px] [&>*]:shrink-0 [&>:nth-child(n+8)]:hidden max-lg:!overflow-x-auto max-lg:!overflow-y-hidden max-lg:[&>div]:!min-w-[720px]"
              ></div>

            </div>

          </div>

        </section>


      </div>

    </main>

  </div>


  <!-- Shared logout overlay is created and controlled by bank.js. -->

  <!-- =========================================================
       JAVASCRIPT
       ========================================================= -->
  <script src="../js/bank.js"></script>

</body>
</html>
