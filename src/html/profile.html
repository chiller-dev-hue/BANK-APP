<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Profile | Reen Bank</title><link rel="stylesheet" href="../output.css"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet"></head>
<body class="h-screen overflow-hidden bg-[#f2fbf8] font-poppins text-[#242424]"><div class="pointer-events-none fixed inset-0 -z-10 bg-[#f2fbf8]" aria-hidden="true"></div>
<div class="flex h-screen min-h-0">
    <aside id="dashboard-sidebar" class="fixed inset-y-0 left-0 z-50 flex w-[270px] -translate-x-full flex-col overflow-hidden bg-[#f2fbf8] px-8 py-8 transition-transform duration-300 lg:translate-x-0">

      <div class="flex items-center">
        <img src="../assets/images/logo.png" alt="Reen Bank" class="h-11 w-auto">
      </div>

      <nav class="mt-24" aria-label="Primary navigation">
        <ul class="space-y-7">
          <li>
            <a href="./dashboard.html" class="flex items-center gap-7 text-[15px] font-medium text-[#555555] transition hover:text-primary">
              <span class="flex h-7 w-7 shrink-0 items-center justify-center"><img src="../assets/icons/house.svg" alt="" class="h-6 w-6"></span>
              <span>Overview</span>
            </a>
          </li>
          <li>
            <a href="./accounts.html" class="flex items-center gap-7 text-[15px] font-medium text-[#555555] transition hover:text-primary">
              <span class="flex h-7 w-7 shrink-0 items-center justify-center"><img src="../assets/icons/credit-card.svg" alt="" class="h-6 w-6"></span>
              <span>Accounts</span>
            </a>
          </li>
          <li>
            <a href="./transaction.html" class="flex items-center gap-7 text-[15px] font-medium text-[#555555] transition hover:text-primary">
              <span class="flex h-7 w-7 shrink-0 items-center justify-center"><img src="../assets/icons/arrow-left-right.svg" alt="" class="h-6 w-6"></span>
              <span>Transactions</span>
            </a>
          </li>
          <li>
            <a href="./profile.html" aria-current="page" class="flex items-center gap-7 text-[15px] font-semibold text-primary">
              <span class="flex h-7 w-7 shrink-0 items-center justify-center"><img src="../assets/icons/user.svg" alt="" class="h-6 w-6"></span>
              <span>Profile</span>
            </a>
          </li>
        </ul>
      </nav>

      <div class="mt-auto">
        <button id="logout-button" type="button" class="flex items-center gap-7 text-[15px] font-medium text-[#555555] transition hover:text-red-500">
          <span class="flex h-7 w-7 shrink-0 items-center justify-center"><img src="../assets/icons/log-out.svg" alt="" class="h-6 w-6"></span>
          <span>Logout</span>
        </button>
      </div>
    </aside>
    <div id="dashboard-overlay" class="fixed inset-0 z-40 hidden bg-black/30 lg:hidden"></div>
<main class="min-w-0 min-h-0 flex-1 overflow-hidden px-4 sm:px-6 lg:ml-[260px] lg:px-8 xl:px-10"><div class="flex h-full min-h-0 flex-col">
<header class="shrink-0 pt-5 sm:pt-6 lg:pt-7">
  <div class="mx-auto grid min-w-0 max-w-none grid-cols-1 items-center gap-4 lg:grid-cols-[minmax(0,3fr)_minmax(420px,2fr)] lg:gap-10">

    <!-- LEFT HEADER COLUMN: title + identity at the right edge of the left grid -->
    <div class="flex min-w-0 items-center justify-between gap-6">
      <div class="flex min-w-0 items-center gap-3">
        <button id="dashboard-menu-button" type="button" aria-label="Open navigation menu" aria-expanded="false" aria-controls="dashboard-sidebar" class="flex h-10 w-10 shrink-0 items-center justify-center rounded-lg border border-black/10 bg-white lg:hidden">
          <img src="../assets/icons/menu.svg" alt="" class="h-4 w-4">
        </button>
        <h1 class="m-0 shrink-0 text-[28px] font-semibold leading-none tracking-tight sm:text-[32px]">Profile</h1>
      </div>

      <div class="hidden min-w-0 shrink-0 flex-col items-end text-right lg:flex">
        <p id="dashboard-user-name" class="whitespace-nowrap text-xs font-medium leading-tight text-primary sm:text-sm">Maureen Oguche</p>
        <p id="dashboard-account-number" class="mt-0.5 whitespace-nowrap text-xl font-bold leading-none tracking-tight sm:text-2xl">1234567890</p>
      </div>
    </div>

    <!-- RIGHT HEADER COLUMN: search begins at the right-column edge -->
    <div class="grid min-w-0 grid-cols-[minmax(0,1fr)_auto_auto] items-center gap-3 sm:gap-4">
      <div class="hidden min-w-0 items-center gap-2 md:flex justify-self-start">
        <img src="../assets/icons/search.svg" alt="Search" class="h-5 w-5 shrink-0">
        <input id="profile-transaction-search" type="search" placeholder="Search" aria-label="Search" class="w-20 bg-transparent text-xs outline-none placeholder:text-[#777] sm:w-24">
      </div>
      <button type="button" aria-label="Search" class="flex h-8 w-8 items-center justify-center md:hidden">
        <img src="../assets/icons/search.svg" alt="" class="h-5 w-5">
      </button>
      <div class="relative justify-self-end">
        <button id="dashboard-notification-button" type="button" aria-label="Notifications" aria-expanded="false" class="relative flex h-8 w-8 shrink-0 items-center justify-center">
          <img src="../assets/icons/bell.svg" alt="" class="h-5 w-5 opacity-70">
          <span id="dashboard-notification-dot" class="absolute right-1 top-1 hidden h-2 w-2 rounded-full bg-danger"></span>
        </button>
        <div id="dashboard-notification-panel" class="absolute right-0 top-10 z-[90] hidden w-[310px] rounded-xl border border-[#dce7e2] bg-white p-4 shadow-xl">
          <div class="flex items-center justify-between gap-3">
            <h3 class="text-sm font-semibold text-[#111]">Notifications</h3>
            <button id="dashboard-clear-notifications" type="button" class="text-xs font-semibold text-primary hover:underline">Clear</button>
          </div>
          <div id="dashboard-notification-list" class="mt-3 space-y-2"></div>
        </div>
      </div>
      <a id="dashboard-profile-button" href="./profile.html" aria-label="Open profile" class="relative inline-flex h-10 w-10 shrink-0 items-center justify-center justify-self-end overflow-hidden rounded-full border border-[rgba(69,32,128,0.08)] bg-[#e2cfff] text-sm font-bold leading-none text-[#452080] no-underline sm:h-11 sm:w-11 lg:h-12 lg:w-12">
        <span id="dashboard-profile-initials" aria-hidden="true" class="absolute inset-0 flex h-full w-full items-center justify-center overflow-hidden rounded-full bg-[#e2cfff] bg-cover bg-center bg-no-repeat">MO</span>
      </a>
    </div>

  </div>
</header>
<section class="[scrollbar-width:none] [&::-webkit-scrollbar]:hidden min-h-0 flex-1 overflow-hidden pt-3 sm:pt-4 lg:pt-5">
  <div class="mx-auto grid min-h-0 max-w-7xl grid-cols-1 items-start gap-5 lg:grid-cols-[minmax(0,3fr)_minmax(420px,2fr)] lg:gap-10">
    <article class="h-fit min-h-0 self-start overflow-hidden rounded-xl bg-white px-5 py-3 sm:px-7 sm:py-4 lg:px-8">
      <div class="flex flex-col items-center text-center">
        <div class="relative h-24 w-24 overflow-hidden rounded-full bg-[#e2cfff] sm:h-28 sm:w-28 lg:h-28 lg:w-28"><button id="profile-avatar-button" type="button" class="relative h-full w-full overflow-hidden rounded-full" aria-label="Change profile photo"><span id="profile-avatar-initials" class="flex h-full w-full items-center justify-center text-3xl font-bold text-[#452080]">MO</span><img id="profile-avatar-image" class="hidden h-full w-full object-cover" alt="Profile photo"><span class="absolute bottom-1 right-1 flex h-7 w-7 items-center justify-center rounded-full bg-[#d7d7d7] text-base text-[#444]">✎</span></button><input id="profile-photo-input" type="file" accept="image/jpeg,image/png,image/webp" class="hidden"></div>
        <h2 id="profile-name-display" class="mt-1 text-xl font-semibold leading-tight tracking-tight">Maureen Oguche</h2><span class="mt-1 rounded-md bg-[#e2cfff] px-3 py-1 text-[11px] font-semibold text-[#452080]">Pro User</span>
      </div>
      <form id="profile-form" class="mx-auto mt-2 w-full max-w-[380px]">
        <div class="border-b border-[#d8e1de] pb-1"><label for="profile-email" class="text-xs font-medium text-primary">Email</label><input id="profile-email" type="email" readonly class="mt-0.5 block w-full bg-transparent text-[13px] font-semibold leading-tight text-[#242424] outline-none" autocomplete="email"></div>
        <div class="border-b border-[#d8e1de] pb-1 pt-2"><label for="profile-phone" class="text-xs font-medium text-primary">Phone Number</label><input id="profile-phone" type="tel" inputmode="tel" maxlength="15" placeholder="Enter phone number" class="mt-0.5 block w-full bg-transparent text-[13px] font-semibold leading-tight text-[#242424] outline-none" autocomplete="tel"></div>
        <div class="border-b border-[#d8e1de] pb-1 pt-2"><label for="profile-gender" class="text-xs font-medium text-primary">Gender</label><select id="profile-gender" class="mt-0.5 block w-full appearance-none bg-transparent text-[13px] font-semibold leading-tight text-[#242424] outline-none" autocomplete="sex"><option value="">Select gender</option><option value="Male">Male</option><option value="Female">Female</option><option value="Other">Other</option><option value="Prefer not to say">Prefer not to say</option></select></div>
        <p id="profile-message" class="hidden text-xs" aria-live="polite"></p><button id="profile-save-changes" type="submit" class="mt-2 h-9 w-full rounded-lg bg-primary text-[13px] font-semibold text-white">Save Changes</button><button id="reset-password-button" type="button" class="mt-2 h-9 w-full rounded-lg bg-primary text-[13px] font-semibold text-white">Reset Password</button>
        <input id="profile-name" type="hidden"><input id="profile-account" type="hidden"><input id="profile-new-password" type="hidden">
      </form>
    </article>
    <aside class="min-h-0 overflow-hidden">
      <article class="rounded-xl bg-[#D4F3E7] p-4 sm:p-5"><div class="flex items-center justify-between gap-4"><p class="text-sm font-semibold text-[#452080]">Main Account</p><button id="profile-balance-toggle" type="button" aria-label="Hide balance" class="shrink-0"><img src="../assets/icons/eye.svg" alt="" class="h-5 w-5"></button></div><p id="profile-main-balance" class="mt-2 whitespace-nowrap text-xl font-bold leading-none sm:text-2xl">₦ 0.00</p></article>
      <div class="mt-5 min-h-0 overflow-hidden"><div class="flex items-center justify-between gap-4"><h2 class="text-base font-semibold">Transactions</h2><a href="./transaction.html" aria-label="View all transactions" class="flex h-8 w-8 items-center justify-center text-primary"><span aria-hidden="true" class="profile-transaction-arrow h-5 w-5"></span></a></div><div class="mt-3 min-h-0 overflow-hidden"><div id="profile-transactions-list" class="min-h-0 min-w-0"></div></div></div>
    </aside>
  </div>
</section></div></main></div>
  <div id="logout-overlay" class="fixed inset-0 z-[9999] hidden flex items-center justify-center bg-[radial-gradient(circle_at_50%_50%,rgba(51,183,134,.42)_0%,rgba(51,183,134,.25)_38%,rgba(212,243,231,.60)_72%,rgba(255,255,255,.15)_100%)] p-7 font-poppins backdrop-blur-[3px]" aria-hidden="true"><div id="logout-modal" role="dialog" aria-modal="true" aria-labelledby="logout-title" class="relative z-[1] box-border rounded-[30px] bg-white text-[#242424] shadow-[0_24px_70px_rgba(51,183,134,0.18)] reen-overlay-card-logout"><h2 id="logout-title">Are you sure you want to Logout?</h2><div class="reen-overlay-actions"><button id="cancel-logout" type="button" class="reen-overlay-cancel">Cancel</button><button id="confirm-logout" type="button" class="reen-overlay-primary">Logout</button></div></div></div>
  <script src="../js/bank.js"></script>
  <script src="../js/reset-password.js"></script>
</body>
</html>
